name: Build desktop installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            artifact: docreview-windows-x64
            args: --win nsis --x64
          - os: macos-latest
            label: macOS Intel
            artifact: docreview-macos-intel
            args: --mac dmg --x64
          - os: macos-latest
            label: macOS Apple Silicon
            artifact: docreview-macos-arm
            args: --mac dmg --arm64

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install packaging tool
        run: npm install --no-save --ignore-scripts electron-builder@26.0.12

      - name: Run tests
        run: npm run reviewer:test

      - name: Build Electron application
        run: npm run reviewer:build

      - name: Package installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --config electron-builder.yml ${{ matrix.args }} --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: error
          retention-days: 14
