appId: ru.docreview.desktop
productName: ДокРевью
directories:
  output: release
files:
  - out/**/*
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: 'DocReview-${version}-Windows-${arch}-Setup.${ext}'
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  artifactName: 'DocReview-${version}-macOS-${arch}.${ext}'
